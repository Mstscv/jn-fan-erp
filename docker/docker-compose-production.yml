version: '3.8'

networks:
  jn-erp-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql-data:
  redis-data:
  minio-data:
  nacos-data:
  logs:

services:
  mysql:
    image: mysql:8.0
    container_name: jn-erp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: JnErp_2026!
      MYSQL_DATABASE: jn_erp
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../sql/sprint02_biz_tables.sql:/docker-entrypoint-initdb.d/02-biz-tables.sql
    networks:
      - jn-erp-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
      --innodb_buffer_pool_size=2G

  redis:
    image: redis:7.2
    container_name: jn-erp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - jn-erp-net

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: jn-erp-nacos
    restart: always
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
    volumes:
      - nacos-data:/home/nacos/data
    networks:
      - jn-erp-net

  minio:
    image: minio/minio:latest
    container_name: jn-erp-minio
    restart: always
    environment:
      MINIO_ROOT_USER: jnerp
      MINIO_ROOT_PASSWORD: JnErp_Minio_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - jn-erp-net

  gateway:
    image: jn-erp/ruoyi-gateway:latest
    container_name: jn-erp-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - logs:/logs
    depends_on:
      - nacos
      - redis
    networks:
      - jn-erp-net

  auth:
    image: jn-erp/ruoyi-auth:latest
    container_name: jn-erp-auth
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - logs:/logs
    depends_on:
      - nacos
      - redis
    networks:
      - jn-erp-net

  system:
    image: jn-erp/ruoyi-system:latest
    container_name: jn-erp-system
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - logs:/logs
    depends_on:
      - nacos
      - mysql
    networks:
      - jn-erp-net

  material:
    image: jn-erp/jn-erp-material:latest
    container_name: jn-erp-material
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - logs:/logs
    depends_on:
      - nacos
      - mysql
    networks:
      - jn-erp-net

  sales:
    image: jn-erp/jn-erp-sales:latest
    container_name: jn-erp-sales
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - logs:/logs
    depends_on:
      - nacos
      - mysql
    networks:
      - jn-erp-net

  purchase:
    image: jn-erp/jn-erp-purchase:latest
    container_name: jn-erp-purchase
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - logs:/logs
    depends_on:
      - nacos
      - mysql
    networks:
      - jn-erp-net

  warehouse:
    image: jn-erp/jn-erp-warehouse:latest
    container_name: jn-erp-warehouse
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - logs:/logs
    depends_on:
      - nacos
      - mysql
    networks:
      - jn-erp-net

  production:
    image: jn-erp/jn-erp-production:latest
    container_name: jn-erp-production
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - logs:/logs
    depends_on:
      - nacos
      - mysql
    networks:
      - jn-erp-net

  finance:
    image: jn-erp/jn-erp-finance:latest
    container_name: jn-erp-finance
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - logs:/logs
    depends_on:
      - nacos
      - mysql
    networks:
      - jn-erp-net
